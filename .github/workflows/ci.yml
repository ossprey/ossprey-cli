name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Configure credentials
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8
        with:
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: admin
          profile-region: us-east-1
          async: true

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "::error::files not gofmt'd:"
            echo "$diff"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go vet -tags smoke
        run: go vet -tags smoke ./...

  test-matrix:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Configure credentials
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8
        with:
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: admin
          profile-region: us-east-1
          async: true

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # The forwarder's npm tables are held to the installed npm, so every
      # runner gets the same one rather than whatever its image ships.
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '24'
      - name: Pin npm
        run: npm install -g npm@11.19.1

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

  # Runs the whole tagged suite, on Windows too since pnpm and the shims are .cmd files there (OSS-1566).
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Configure credentials
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8
        with:
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: admin
          profile-region: us-east-1
          async: true

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '24'

      - name: Pin npm and install pnpm
        run: npm install -g npm@11.19.1 pnpm@latest

      - name: pnpm version
        run: pnpm --version

      - name: go test -tags smoke
        run: go test -tags smoke -count=1 -timeout 15m -v ./test/smoke/...

  # Aggregate gate for branch protection: reports a single "Test" check that
  # is green only when every matrix leg passed. `if: always()` is required —
  # a skipped job would satisfy the required check even when the matrix failed.
  test:
    name: Test
    needs: [test-matrix, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Configure credentials
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8
        with:
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: admin
          profile-region: us-east-1
      - name: Require all matrix jobs to pass
        env:
          RESULT: ${{ needs.test-matrix.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          echo "matrix result: $RESULT"
          echo "smoke result: $SMOKE_RESULT"
          [ "$RESULT" = "success" ] && [ "$SMOKE_RESULT" = "success" ]
